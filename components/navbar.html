<!-- SEARCH OVERLAY -->
<div
    class="search-overlay"
    id="searchOverlay"
    aria-hidden="true"
>

    <!-- BACKDROP -->
    <div
        class="search-overlay-backdrop"
        id="searchBackdrop"
    ></div>

    <!-- SEARCH PANEL -->
    <div
        class="search-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="searchPanelTitle"
    >

        <!-- SEARCH HEADER -->
        <div class="search-panel-header">

            <div>
                <p class="search-eyebrow">LUXURY JEWELRY</p>
                <h2 id="searchPanelTitle">Find Your Perfect Piece</h2>

            </div>


            <!-- CLOSE SEARCH -->

            <button
                class="search-close"
                id="closeSearch"
                type="button"
                aria-label="Close Search"
            >
                ✕
            </button>

        </div>

        <!-- SEARCH INPUT -->
        <div class="search-input-wrapper">

            <span class="search-input-icon" aria-hidden="true">
                <i class="fa-solid fa-magnifying-glass"></i>
            </span>

            <input
                type="text"
                id="navbarSearchInput"
                placeholder="Search rings, necklaces, earrings..."
                autocomplete="off"
                aria-label="Search jewelry"
            >
            
            <!-- CLEAR SEARCH -->
            <button
                type="button"
                class="search-clear"
                id="clearSearch"
                aria-label="Clear search"
            >
                ✕
            </button>

        </div>

        <!-- SEARCH CONTENT -->
        <div class="search-content" id="searchContent">

            <p class="search-label">POPULAR SEARCHES</p>

            <div class="popular-searches">
                <button type="button" data-search="Rings">Rings</button>
                <button type="button" data-search="Necklaces">Necklaces</button>
                <button type="button" data-search="Earrings">Earrings</button>
                <button type="button" data-search="Bracelets">Bracelets</button>
                <button type="button" data-search="Jewelry Sets">Jewelry Sets</button>
            </div>

            <!-- SEARCH MESSAGE -->
            <div class="search-message">
                <span>✧</span>
                <p>Start typing to search our jewelry collection.</p>
            </div>

        </div>

    </div>

</div>
