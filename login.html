<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Luxury Jewelry</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Login CSS -->
    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <!-- =========================
         LOGIN SECTION
    ========================== -->

    <main class="login-page">

        <div class="login-container">


            <!-- =========================
                 LEFT IMAGE
            ========================== -->

            <div class="login-image">

                <img
                    src="images/imagem.jpg"
                    alt="Luxury Jewelry">

                <div class="login-image-overlay">

                    <h2>
                        Welcome Back
                    </h2>

                    <p>
                        Discover timeless elegance and beautiful
                        jewelry made for every moment.
                    </p>

                </div>

            </div>


            <!-- =========================
                 RIGHT LOGIN FORM
            ========================== -->

            <div class="login-form-wrapper">


                <!-- =========================
                     DARK / LIGHT MODE
                ========================== -->

                <button
                    type="button"
                    class="login-theme-toggle"
                    id="themeToggle"
                    aria-label="Toggle Dark Mode"
                    title="Toggle Dark Mode">

                    <span id="themeIcon">☾</span>

                </button>


                <!-- =========================
                     BACK TO HOME
                ========================== -->

                <a
                    href="index.html"
                    class="back-home">

                    <span class="back-arrow">←</span>

                    <span>
                        Back to Home
                    </span>

                </a>


                <!-- =========================
                     LOGIN HEADER
                ========================== -->

                <div class="login-form-header">

                    <p class="section-subtitle">
                        WELCOME TO LUXURY JEWELRY
                    </p>

                    <h1>
                        Login
                    </h1>

                    <p>
                        Sign in to continue to your account.
                    </p>

                </div>


                <!-- =========================
                     LOGIN FORM
                ========================== -->

                <form
                    id="loginForm"
                    class="login-form">


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required>

                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle">

                                Show

                            </button>

                        </div>

                    </div>


                    <!-- =========================
                         LOGIN OPTIONS
                    ========================== -->

                    <div class="login-options">

                        <label class="remember-me">

                            <input
                                type="checkbox"
                                id="rememberMe">

                            <span>
                                Remember me
                            </span>

                        </label>


                        <a
                            href="#"
                            id="forgotPassword">

                            Forgot Password?

                        </a>

                    </div>


                    <!-- =========================
                         LOGIN BUTTON
                    ========================== -->

                    <button
                        type="submit"
                        class="login-btn">

                        Login

                    </button>


                    <!-- =========================
                         DIVIDER
                    ========================== -->

                    <div class="login-divider">

                        <span>
                            OR
                        </span>

                    </div>


                    <!-- =========================
                         SIGN UP
                    ========================== -->

                    <p class="signup-text">

                        Don't have an account?

                        <a href="signup.html">
                            Sign Up
                        </a>

                    </p>

                </form>

            </div>

        </div>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/login.js"></script>


    <!-- =========================
         LOGIN THEME
    ========================== -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const themeToggle =
                document.getElementById("themeToggle");

            const themeIcon =
                document.getElementById("themeIcon");

            if (!themeToggle || !themeIcon) {
                return;
            }


            /* =========================
               LOAD SAVED THEME
            ========================== */

            const savedTheme =
                localStorage.getItem("luxuryJewelryTheme");

            if (savedTheme === "dark") {

                document.body.classList.add("dark-mode");

                themeIcon.textContent = "☀";

                themeToggle.setAttribute(
                    "aria-label",
                    "Switch to Light Mode"
                );

            } else {

                themeIcon.textContent = "☾";

                themeToggle.setAttribute(
                    "aria-label",
                    "Switch to Dark Mode"
                );

            }


            /* =========================
               TOGGLE THEME
            ========================== */

            themeToggle.addEventListener("click", function () {

                document.body.classList.toggle("dark-mode");

                const isDark =
                    document.body.classList.contains("dark-mode");


                if (isDark) {

                    themeIcon.textContent = "☀";

                    themeToggle.setAttribute(
                        "aria-label",
                        "Switch to Light Mode"
                    );

                    themeToggle.setAttribute(
                        "title",
                        "Switch to Light Mode"
                    );

                    localStorage.setItem(
                        "luxuryJewelryTheme",
                        "dark"
                    );

                } else {

                    themeIcon.textContent = "☾";

                    themeToggle.setAttribute(
                        "aria-label",
                        "Switch to Dark Mode"
                    );

                    themeToggle.setAttribute(
                        "title",
                        "Switch to Dark Mode"
                    );

                    localStorage.setItem(
                        "luxuryJewelryTheme",
                        "light"
                    );

                }

            });

        });

    </script>

</body>

</html>
