<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up | Luxury Jewelry</title>


    <!-- =========================
         GOOGLE FONTS
    ========================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- =========================
         MAIN CSS
    ========================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- =========================
         SIGNUP CSS
    ========================== -->

    <link
        rel="stylesheet"
        href="css/signup.css"
    >

</head>


<body>


    <!-- =====================================================
         SIGNUP PAGE
    ====================================================== -->

    <main class="signup-page">


        <div class="signup-container">


            <!-- =================================================
                 LEFT IMAGE
            ================================================== -->

            <div class="signup-image">

                <img
                    src="images/imagem.jpg"
                    alt="Luxury Jewelry"
                >


                <div class="signup-image-overlay">

                    <h2>
                        Luxury Jewelry
                    </h2>

                    <p>
                        Discover timeless elegance and beautiful
                        jewelry made for every special moment.
                    </p>

                </div>

            </div>



            <!-- =================================================
                 RIGHT SIGNUP FORM
            ================================================== -->

            <div class="signup-form-wrapper">


                <!-- =============================================
                     DARK / LIGHT MODE BUTTON
                ============================================== -->

                <button
                    type="button"
                    class="signup-theme-toggle"
                    id="signupThemeToggle"
                    aria-label="Switch to Dark Mode"
                    title="Switch to Dark Mode"
                >
                    <span id="signupThemeIcon">☾</span>
                </button>



                <!-- =============================================
                     BACK TO HOME
                ============================================== -->

                <a
                    href="index.html"
                    class="back-home"
                >

                    <span class="back-arrow">
                        ←
                    </span>

                    <span>
                        Back to Home
                    </span>

                </a>



                <!-- =============================================
                     SIGNUP HEADER
                ============================================== -->

                <div class="signup-form-header">


                    <p class="section-subtitle">
                        WELCOME TO LUXURY JEWELRY
                    </p>


                    <h1>
                        Sign Up
                    </h1>


                    <p>
                        Create an account to begin your journey with us.
                    </p>


                </div>



                <!-- =============================================
                     SIGNUP FORM
                ============================================== -->

                <form
                    id="signupForm"
                    class="signup-form"
                >


                    <!-- =========================================
                         FULL NAME
                    ========================================== -->

                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                        </label>


                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>



                    <!-- =========================================
                         EMAIL
                    ========================================== -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>


                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>



                    <!-- =========================================
                         PASSWORD
                    ========================================== -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>


                        <div class="password-wrapper">


                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                minlength="6"
                                required
                            >


                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle"
                            >
                                Show
                            </button>


                        </div>

                    </div>



                    <!-- =========================================
                         CONFIRM PASSWORD
                    ========================================== -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>


                        <div class="password-wrapper">


                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm your password"
                                minlength="6"
                                required
                            >


                            <button
                                type="button"
                                id="toggleConfirmPassword"
                                class="password-toggle"
                            >
                                Show
                            </button>


                        </div>

                    </div>



                    <!-- =========================================
                         TERMS
                    ========================================== -->

                    <label class="terms-checkbox">


                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >


                        <span>
                            I agree to the Terms & Conditions
                            and Privacy Policy.
                        </span>


                    </label>



                    <!-- =========================================
                         SIGNUP BUTTON
                    ========================================== -->

                    <button
                        type="submit"
                        class="signup-btn"
                    >
                        Create Account
                    </button>



                    <!-- =========================================
                         DIVIDER
                    ========================================== -->

                    <div class="signup-divider">

                        <span>
                            OR
                        </span>

                    </div>



                    <!-- =========================================
                         LOGIN LINK
                    ========================================== -->

                    <p class="login-text">

                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>

                    </p>


                </form>


            </div>


        </div>


    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="js/signup.js"></script>



    <!-- =====================================================
         SIGNUP DARK / LIGHT MODE
    ====================================================== -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const themeToggle =
                document.getElementById("signupThemeToggle");

            const themeIcon =
                document.getElementById("signupThemeIcon");


            if (!themeToggle) {
                return;
            }


            /* =========================
               LOAD SAVED THEME
            ========================== */

            const savedTheme =
                localStorage.getItem("luxuryJewelryTheme");


            if (savedTheme === "dark") {

                document.body.classList.add("dark-mode");

                themeIcon.textContent = "☀";

                themeToggle.setAttribute(
                    "aria-label",
                    "Switch to Light Mode"
                );

                themeToggle.setAttribute(
                    "title",
                    "Switch to Light Mode"
                );

            } else {

                themeIcon.textContent = "☾";

                themeToggle.setAttribute(
                    "aria-label",
                    "Switch to Dark Mode"
                );

                themeToggle.setAttribute(
                    "title",
                    "Switch to Dark Mode"
                );

            }



            /* =========================
               TOGGLE THEME
            ========================== */

            themeToggle.addEventListener("click", function () {

                document.body.classList.toggle("dark-mode");


                const isDark =
                    document.body.classList.contains("dark-mode");


                if (isDark) {

                    localStorage.setItem(
                        "luxuryJewelryTheme",
                        "dark"
                    );

                    themeIcon.textContent = "☀";

                    themeToggle.setAttribute(
                        "aria-label",
                        "Switch to Light Mode"
                    );

                    themeToggle.setAttribute(
                        "title",
                        "Switch to Light Mode"
                    );

                } else {

                    localStorage.setItem(
                        "luxuryJewelryTheme",
                        "light"
                    );

                    themeIcon.textContent = "☾";

                    themeToggle.setAttribute(
                        "aria-label",
                        "Switch to Dark Mode"
                    );

                    themeToggle.setAttribute(
                        "title",
                        "Switch to Dark Mode"
                    );

                }

            });

        });

    </script>


</body>

</html>
